<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9eef2" />
    <title>BlueberryUB</title>
    <link rel="icon" href="/logo/blueub.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/home.css" />
    <script src="/home.js" defer></script>
  </head>
  <body>
    <main class="launcher">
      <section class="hub" aria-label="BlueberryUB menu">
        <svg class="hub-outline" viewBox="0 0 640 640" aria-hidden="true">
          <circle class="outer-ring" cx="320" cy="320" r="286" />
          <circle class="inner-ring" cx="320" cy="320" r="210" />
        </svg>

        <a class="menu-option browser-option" href="/browser.html">
          <svg class="menu-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="4.5" y="6" width="23" height="17" rx="2"/><path d="M11 27h10m-5-4v4M9 10h14"/></svg>
          <span>Browser</span>
        </a>

        <button class="menu-option soon-option soon-left" type="button" disabled aria-label="Soon">
          <svg class="menu-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 24 24 5l3 3L8 27H5v-3Z"/><path d="m20 9 3 3M7 23l3 3"/></svg>
          <span>Soon</span>
        </button>

        <a class="menu-option profile-option soon-right" href="/profile.html">
          <svg class="menu-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="10" r="5"/><path d="M6 27c0-6 4-10 10-10s10 4 10 10"/></svg>
          <span>Profile</span>
        </a>

        <button class="menu-option soon-option soon-bottom" type="button" disabled aria-label="Soon">
          <svg class="menu-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="m16 3 2 2.5 3.2-.5.9 3 3 1.2-.7 3.2L27 16l-2.5 2  .5 3.2-3 .9-1.2 3-3.2-.7L16 27l-2-2.5-3.2.5-.9-3-3-1.2.7-3.2L5 16l2.5-2-.5-3.2 3-.9 1.2-3 3.2.7L16 3Z"/><circle cx="16" cy="16" r="4"/></svg>
          <span>Soon</span>
        </button>

        <div class="hub-center">
          <div class="logo-frame"><img src="/logo/blueub.png" alt="BlueberryUB logo" /></div>
          <span class="version-label">in-dev</span>
          <span class="creator-credit">A browser by Christian Hall</span>
        </div>
      </section>
    </main>
    <label class="private-default" for="private-default-toggle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>Always open privately</span>
      <input id="private-default-toggle" type="checkbox" />
    </label>
  </body>
</html>
